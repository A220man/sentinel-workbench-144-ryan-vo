version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./sentinel.db
      - SECRET_KEY=change-me-in-production-min-32-chars
      - OIDC_ENABLED=false
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/sentinel
      - OIDC_CLIENT_ID=sentinel-workbench
      - OIDC_REDIRECT_URI=http://localhost/callback
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173"]
      - DEBUG=true
    volumes:
      - backend-data:/app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sentinel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    networks:
      - sentinel-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sentinel-keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USER=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sentinel-network

volumes:
  backend-data:
  keycloak-data:

networks:
  sentinel-network:
    driver: bridge
