[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-workbench"
version = "1.0.0"
description = "Sentinel Workbench - Terminal window manager for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["terminal", "window-manager", "ai-agents", "multiplexer", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.35",
    "alembic==1.14.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.4.0",
    "python-multipart==0.0.9",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "anyio==4.5.2",
    "PyYAML==6.0.2",
    "tomli==2.0.1",
    "tomli-w==1.0.0",
    "structlog==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.27.0",
    "faker==33.1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "W"]
lint.ignore = ["S101", "S113", "S311", "S603", "S607", "B008", "B011", "PTH118", "PTH123"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
namespace_packages = true
