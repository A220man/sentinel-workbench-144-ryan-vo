name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          
      - name: Run tests
        run: |
          .venv/bin/python -m pytest backend/tests -v --tb=short
        env:
          PYTHONPATH: backend
          
      - name: Build Docker image
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          
      - name: Build backend Dockerfile
        run: |
          docker build -t sentinel-backend:test .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
          
      - name: Run typecheck
        run: npx tsc --noEmit
          
      - name: Run tests
        run: npm test
          
      - name: Build
        run: npm run build
          
      - name: Build Docker image
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          
      - name: Build frontend Dockerfile
        run: |
          docker build -t sentinel-frontend:test .

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: |
          docker compose up -d
          
      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health > /dev/null && curl -sf http://localhost > /dev/null; then
              echo "Services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Services failed to start"
          docker compose logs
          exit 1
          
      - name: Run integration test
        run: |
          # Test health endpoint
          curl -sf http://localhost:8000/api/health | jq -e '.status == "ok"'
          
          # Test demo login
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"test"}' | jq -r .access_token)
          
          # Test authenticated endpoint
          curl -sf http://localhost:8000/api/sessions \
            -H "Authorization: Bearer $TOKEN" | jq -e '.items | length >= 0'
          
      - name: Cleanup
        if: always()
        run: docker compose down -v
